[package]
name = "miau"
version = "0.1.0"
edition = "2021"
description = "Lock your screen! 🐈 – now blazingly fast and memory safe"
license = "MIT"

[lib]
crate-type = ["cdylib"]

[dependencies]
wasm-bindgen = "0.2"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Window", "Document", "Element", "HtmlImageElement"] }

[profile.release]
opt-level = "z"
lto = true
