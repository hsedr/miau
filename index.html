<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lock your screen 🐈</title>
<style>
  html,body{margin:0;height:100%;background:#000;color:#fff;font:bold clamp(1.5rem,5vw,4rem)/1.2 system-ui,sans-serif;cursor:pointer}
  img{position:fixed;inset:0;width:100%;height:100%;object-fit:contain}
  p{position:fixed;left:0;right:0;bottom:5vh;margin:0 1em;text-align:center;text-shadow:0 0 .3em #000,0 0 .1em #000}
</style>
<img alt="Katze">
<p></p>
<script>
const sprueche = [
  "Ich hab vergessen, meinen Bildschirm zu sperren. Jetzt gehört er der Katze.",
  "Mein Passwort ist „miau123“. War's schon immer.",
  "Ich bringe morgen Kuchen für alle mit. 🎂",
  "Ich bin eigentlich nur drei Katzen in einem Trenchcoat.",
  "Win + L ist mir zu kompliziert.",
  "Heute schon den Monitor gestreichelt?",
  "Ich habe beschlossen, ab jetzt nur noch in Comic Sans zu schreiben.",
  "Diese Katze hat gerade alle meine Tickets auf „Done“ gesetzt.",
  "Ich lese meine Mails nur noch laut vor.",
  "Bin kurz weg. Die Katze übernimmt das Daily.",
];
const img = document.querySelector("img"), p = document.querySelector("p");
function neu() {
  img.src = "https://cataas.com/cat?" + Date.now();
  p.textContent = sprueche[Math.floor(Math.random() * sprueche.length)];
}
document.onclick = () => { document.documentElement.requestFullscreen?.().catch(() => {}); neu(); };
neu();
</script>
